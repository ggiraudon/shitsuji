# Shitsuji configuration. Copy to shitsuji.config.yaml (ignored by git) and adjust.
# Values can use ${VAR} or ${VAR:-default}; secrets belong in .env, not here.

owner:
  name: Owner
  # timezone: Europe/Paris   # defaults to this machine's timezone
  locale: en

logging:
  level: info # debug | info | warn | error
  format: pretty # pretty for a terminal, json for containers

paths:
  dataDir: ~/.shitsuji/data

database:
  url: ${DATABASE_URL:-postgres://shitsuji:shitsuji@localhost:5432/shitsuji}

models:
  providers:
    deepseek:
      kind: openai-compatible
      baseUrl: https://api.deepseek.com/v1
      apiKey: ${DEEPSEEK_API_KEY}
    # openrouter:
    #   kind: openai-compatible
    #   baseUrl: https://openrouter.ai/api/v1
    #   apiKey: ${OPENROUTER_API_KEY}
    # local:
    #   kind: openai-compatible
    #   baseUrl: http://ollama:11434/v1
    # anthropic:
    #   kind: anthropic
    #   apiKey: ${ANTHROPIC_API_KEY}
  purposes:
    chat: deepseek/deepseek-flash
    task: deepseek/deepseek-flash
    summarize: deepseek/deepseek-flash
    vision: deepseek/deepseek-flash
    trust: deepseek/deepseek-flash
  fallbacks: {}
  # What is known about each model. Prices are never guessed: without one, usage is recorded with
  # an unknown cost. Fill them in from the provider's price list (per million tokens).
  catalog:
    deepseek/deepseek-flash:
      capabilities: [tools, vision, reasoning]
      # price: { currency: USD, inputPerMTok: 0, cachedInputPerMTok: 0, outputPerMTok: 0 }
  retry:
    maxAttempts: 3 # transient failures only, and never after the model has started answering

channels:
  cli:
    enabled: true
  webhook:
    enabled: true
    port: 3000
    path: /webhook
