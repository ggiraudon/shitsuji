# Shitsuji configuration. Copy to shitsuji.config.yaml (ignored by git) and adjust.
# Values can use ${VAR} or ${VAR:-default}; secrets belong in .env, not here.

owner:
  name: Owner
  # timezone: Europe/Paris   # defaults to this machine's timezone
  locale: en

logging:
  level: info # debug | info | warn | error
  format: pretty # pretty for a terminal, json for containers

paths:
  dataDir: ~/.shitsuji/data

database:
  url: ${DATABASE_URL:-postgres://shitsuji:shitsuji@localhost:5432/shitsuji}

models:
  providers:
    deepseek:
      kind: openai-compatible
      baseUrl: https://api.deepseek.com/v1
      apiKey: ${DEEPSEEK_API_KEY}
    # openrouter:
    #   kind: openai-compatible
    #   baseUrl: https://openrouter.ai/api/v1
    #   apiKey: ${OPENROUTER_API_KEY}
    # local:
    #   kind: openai-compatible
    #   baseUrl: http://ollama:11434/v1
    # anthropic:
    #   kind: anthropic
    #   apiKey: ${ANTHROPIC_API_KEY}
  purposes:
    chat: deepseek/deepseek-flash
    task: deepseek/deepseek-flash
    summarize: deepseek/deepseek-flash
    vision: deepseek/deepseek-flash
    trust: deepseek/deepseek-flash
  fallbacks: {}
  # What is known about each model. Prices are never guessed: without one, usage is recorded with
  # an unknown cost. Fill them in from the provider's price list (per million tokens).
  catalog:
    deepseek/deepseek-flash:
      capabilities: [tools, vision, reasoning]
      # price: { currency: USD, inputPerMTok: 0, cachedInputPerMTok: 0, outputPerMTok: 0 }
  retry:
    maxAttempts: 3 # transient failures only, and never after the model has started answering

# Spending limits (F22). Amounts are in `currency`; the period is the calendar month, UTC.
budget:
  currency: USD
  monthlyLimit: 30 # past it, only your own messages run; background turns are refused
  backgroundAllowance: 5 # what background work (no owner message) may spend per month
  checkIn: 1 # a session pauses to ask after this much since your last message (S28)

# Standing trust rules (F11, #58): a rule decides before the judge. `verdict` is allow, ask or deny;
# deny beats ask, which beats allow. `payment` still always asks (P6). `detail` is shown in the receipt.
trust:
  # Your rules. A shipped rule always allows workspace.send (X4), the file you asked for; add an
  # ask or deny rule for workspace.send below to override it. Deny beats ask, which beats allow.
  rules: []
  # - { tool: test.notify, verdict: ask, detail: always ask before notifying }
  # - { tool: workspace.send, verdict: ask, detail: ask me before sending files }
  # - { tool: 'mail.*', verdict: ask, detail: always ask before emailing }
  # - { tool: 'web.*', verdict: allow, detail: reading the web is fine }
  # - { tool: shop.pay, verdict: deny, detail: never spend money }

# Where commands and files run (F08). `host` is the core process itself (today's behaviour);
# `opensandbox` and `shitsuji` arrive with S44 and S48. A driver that cannot start leaves the sandbox
# tools off; there is no fallback to `host` (decision X3).
sandbox:
  driver: host
  # What the egress check tries from inside the sandbox (X2); core's API and Postgres are always
  # tried too. `requireIsolation: true` refuses a driver that cannot show the LAN is blocked; the
  # host driver cannot, so it is refused with it.
  probes:
    lan: [192.168.1.1]
    requireIsolation: false

# The sandbox's command tool (F08). The driver may cap the timeout lower; output over maxOutputBytes
# keeps head and tail for the model, and the full log goes to sessions/<sessionId>/.
tools:
  exec:
    enabled: true
    defaultTimeoutSeconds: 600
    maxTimeoutSeconds: 3600
    maxOutputBytes: 1048576

channels:
  webhook: # POST with `Authorization: Bearer <owner key>`; answers with the reply
    enabled: true
    host: 127.0.0.1 # this machine only; Compose sets 0.0.0.0 inside the container
    port: 3000
    path: /webhook
  telegram:
    enabled: false # set true and put SHITSUJI_TELEGRAM_TOKEN in .env; pair the chat with /pair
    token: ${SHITSUJI_TELEGRAM_TOKEN}
