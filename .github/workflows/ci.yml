name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # packages/shared is the shitsuji-shared repo
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-check, lint, import-direction check and unit tests (no network, no Docker).
      - run: pnpm check
      # Postgres in Docker via Testcontainers (the runner has Docker).
      - run: pnpm test:integration
      - run: pnpm build

  # Builds the generated API documentation and the walkthrough pages on every PR. Warnings are shown
  # in the log; `notDocumented` is a warning list for now (issue #92).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # packages/shared is the shitsuji-shared repo
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the docs
        run: |
          set -o pipefail
          pnpm run docs 2>&1 | tee docs.log
          # A broken {@link} or a source link to a missing file must fail the build; missing
          # comments are warnings for now.
          ! grep -E 'Failed to resolve link|The relative path .* is not a file' docs.log

  # Builds Shitsuji's own sandbox image and checks that the daemon inside it answers, authenticates,
  # refuses to leave its roots, runs commands as uid 1000 with no token in reach, and survives a stop,
  # a timeout and a fork bomb (F08, S45–S46). Not part of the stack yet (S48).
  sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the sandbox image
        run: docker build -f docker/sandbox/Dockerfile -t shitsuji/sandbox:ci .
      - name: sandboxd answers, authenticates, executes and stays confined
        run: |
          # The token lives in its own volume: root owns the directory, group 1002 is core's group,
          # and 0770 keeps commands (uid/gid 1000) out. Root here has only CHOWN and FOWNER.
          docker volume create sandbox-secret-ci
          docker run --rm --user 0:0 --cap-drop ALL --cap-add CHOWN --cap-add FOWNER \
            --entrypoint sh -v sandbox-secret-ci:/secret shitsuji/sandbox:ci \
            -c 'chown 0:1002 /secret && chmod 0770 /secret'
          docker run --rm --user 1000:1000 --group-add 1002 \
            --entrypoint sh -v sandbox-secret-ci:/secret shitsuji/sandbox:ci \
            -c 'printf %s ci-token > /secret/token && chmod 0644 /secret/token'

          # --init reaps the fork bomb's zombies; the compose service does the same in S48. The six
          # capabilities are exactly what the entrypoint and sandboxd need (see entrypoint.sh).
          docker run -d --name sandbox-ci --init --pids-limit 128 \
            --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --cap-add SETUID \
            --cap-add SETGID --cap-add SETPCAP --cap-add KILL \
            --security-opt no-new-privileges \
            --mount source=sandbox-secret-ci,target=/run/sandbox-seed,readonly \
            -p 127.0.0.1:4555:4555 shitsuji/sandbox:ci

          ready=no
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:4555/health > /dev/null 2>&1; then ready=yes; break; fi
            sleep 1
          done
          if [ "$ready" != yes ]; then
            echo "sandboxd is not listening on 4555"
            docker logs sandbox-ci
            exit 1
          fi
          curl -fsS http://127.0.0.1:4555/health > /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

          # No setuid binary remains in the image (belt-and-braces; commands have no capabilities).
          # The 2>/dev/null covers /workspace and /handoff, which root cannot traverse without
          # DAC_OVERRIDE; they hold no binaries, and the workspace is checked as its owner too.
          test -z "$(docker exec sandbox-ci sh -c 'find / -xdev -perm -4000 -print -quit 2>/dev/null')"
          test -z "$(docker exec -u 1000:1000 sandbox-ci find /workspace /handoff -xdev -perm -4000 -print -quit)"

          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4555/files/read)" = "401"

          api() {
            curl -fsS -H 'x-sandbox-token: ci-token' -H 'content-type: application/json' "$@"
          }
          run() {
            curl -fsS -N -H 'x-sandbox-token: ci-token' -H 'content-type: application/json' \
              -d "$1" http://127.0.0.1:4555/exec
          }

          # A file round-trip, and a symlink out refused (planted as the workspace's owner, since root
          # has no DAC_OVERRIDE here).
          api -d '{"root":"workspace","path":"notes/a.txt","content":"chestnut"}' \
            http://127.0.0.1:4555/files/write > /dev/null
          api -d '{"root":"workspace","path":"notes/a.txt"}' \
            http://127.0.0.1:4555/files/read > /tmp/read.json
          grep -q chestnut /tmp/read.json
          docker exec -u 1000:1000 sandbox-ci ln -s /etc /workspace/etc-link
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-sandbox-token: ci-token' \
            -H 'content-type: application/json' -d '{"root":"workspace","path":"etc-link/passwd"}' \
            http://127.0.0.1:4555/files/read)" = "403"

          # Commands run as uid 1000, with a clean environment. The token is not in their reach:
          # not through the seed volume, not through /run/sandbox, not in env, not in a readable
          # file whose name mentions it.
          run '{"argv":["python3","-c","print(1)"]}' > /tmp/print1.json
          grep -qF '"text":"1\n"' /tmp/print1.json
          run '{"argv":["sh","-c","id -u; cat /run/sandbox-seed/token 2>&1; ls /run/sandbox-seed 2>&1; cat /run/sandbox/token 2>&1; env; DAEMON=$(pgrep -x node); grep -c SANDBOX_TOKEN /proc/$DAEMON/environ 2>&1; find / -xdev -name \"*token*\" -readable 2>/dev/null | grep -E \"sandbox|seed\"; echo done"]}' \
            > /tmp/token.json
          cat /tmp/token.json
          grep -qF '"text":"1000\n"' /tmp/token.json
          test "$(grep -o 'Permission denied' /tmp/token.json | wc -l)" -ge 2
          if grep -q 'ci-token' /tmp/token.json || grep -q 'SANDBOX_TOKEN=' /tmp/token.json; then
            echo "the token reached a command"
            exit 1
          fi
          # The value is in no readable file.
          run '{"argv":["sh","-c","grep -rl \"$T\" /etc /home /workspace /tmp /app /usr /opt /var /run 2>/dev/null | wc -l"],"env":{"T":"ci-token"}}' \
            > /tmp/token-grep.json
          grep -qF '"text":"0\n"' /tmp/token-grep.json
          # The directory itself is root:1002 0770; root owns it, so it can read the token.
          docker exec sandbox-ci sh -c 'ls -ld /run/sandbox-seed; ls -l /run/sandbox-seed/token' > /tmp/seed.txt
          grep -qE '^drwxrwx--- .*root +1002 .*/run/sandbox-seed$' /tmp/seed.txt

          # A command keeps no capabilities and cannot become another uid (the daemon's ambient
          # SETUID/SETGID/KILL must not survive into it).
          run '{"argv":["sh","-c","grep Cap /proc/self/status; setpriv --reuid=1001 true 2>&1; echo first=$?; setpriv --reuid=0 id 2>&1; echo root=$?"]}' \
            > /tmp/caps.json
          cat /tmp/caps.json
          for set in Inh Prm Eff Bnd Amb; do
            grep -qF "Cap$set:\t0000000000000000" /tmp/caps.json
          done
          grep -q 'setresuid failed' /tmp/caps.json
          grep -q 'first=127' /tmp/caps.json
          grep -q 'root=127' /tmp/caps.json

          # The daemon is uid 1001, so its /proc is not readable by a command.
          docker exec sandbox-ci sh -c 'grep -m1 Uid /proc/$(pgrep -x node)/status' > /tmp/uid.txt
          grep -q '1001' /tmp/uid.txt

          # Stop, timeout and a fork bomb all end, and the sandbox keeps answering.
          run '{"argv":["sleep","30"],"timeoutMs":60000}' > /tmp/exec.ndjson &
          sleep 1
          ID=$(head -1 /tmp/exec.ndjson | sed -E 's/.*"id":"([^"]+)".*/\1/')
          api -d '{}' "http://127.0.0.1:4555/exec/$ID/signal" > /tmp/signal.json
          grep -q '"stopped":true' /tmp/signal.json
          wait
          grep -q '"signal":"SIGTERM"' /tmp/exec.ndjson
          run '{"argv":["sleep","30"],"timeoutMs":500}' > /tmp/timeout.json
          grep -q '"timedOut":true' /tmp/timeout.json
          run '{"argv":["bash","-c",":(){ :|:& };:"],"timeoutMs":3000}' > /dev/null || true
          sleep 4
          run '{"argv":["python3","-c","print(1)"]}' > /tmp/print2.json
          grep -qF '"text":"1\n"' /tmp/print2.json
          docker rm -f sandbox-ci
          docker volume rm sandbox-secret-ci
      - name: Show the daemon log on failure
        if: failure()
        run: docker logs sandbox-ci || true

  # Builds the egress proxy and checks that it refuses private, loopback and metadata addresses while
  # tunnelling a public host, and that the allow list narrows the open default (F08, S47).
  egress-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the egress proxy image
        run: docker build -f docker/egress-proxy/Dockerfile -t shitsuji/egress:ci .
      - name: The proxy refuses private addresses and tunnels a public one
        run: |
          http_code() {
            curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              -x http://127.0.0.1:3128 --noproxy "" "$1"
          }
          start() {
            docker run -d --name egress-ci --read-only --tmpfs /tmp --cap-drop ALL \
              --security-opt no-new-privileges "$@" -p 127.0.0.1:3128:3128 shitsuji/egress:ci
            ready=no
            for i in $(seq 1 20); do
              if curl -fs http://127.0.0.1:3128/health > /dev/null 2>&1; then ready=yes; break; fi
              sleep 1
            done
            if [ "$ready" != yes ]; then
              echo "the egress proxy is not listening"
              docker logs egress-ci
              exit 1
            fi
            curl -fsS http://127.0.0.1:3128/health > /tmp/health.json
            grep -q '"ok":true' /tmp/health.json
          }

          start
          for blocked in \
            http://169.254.169.254/latest/meta-data/ \
            http://127.0.0.1:9/ \
            http://10.1.2.3/; do
            test "$(http_code "$blocked")" = "403"
          done
          test "$(http_code http://example.com/)" = "200"
          test "$(http_code https://example.com/)" = "200"
          docker rm -f egress-ci

          start -e SANDBOX_EGRESS_ALLOW=example.com
          test "$(http_code http://example.com/)" = "200"
          test "$(http_code http://example.org/)" = "403"
          docker rm -f egress-ci

          if docker run --rm --read-only --cap-drop ALL \
            -e SANDBOX_EGRESS_ALLOW=10.0.0.0/8 shitsuji/egress:ci; then
            echo "an allow range overlapping a private one must be refused at startup"
            exit 1
          fi
      - name: Show the proxy log on failure
        if: failure()
        run: docker logs egress-ci || true
