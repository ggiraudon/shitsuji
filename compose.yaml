# Shitsuji stack. `docker compose up` for the services; see compose.dev.yaml for local development.
# Must run unchanged on a plain Linux host: no Windows paths, no Docker Desktop-only features.
name: shitsuji

services:
  core:
    image: shitsuji/core
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Use a URL-safe POSTGRES_PASSWORD (letters, digits, - and _), since it goes into this URL.
      DATABASE_URL: postgres://shitsuji:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/shitsuji
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHITSUJI_SEARXNG_URL: http://searxng:8080
      # The API and the webhook listen on all interfaces inside the container; the ports below keep
      # them on this machine. Both need the owner key.
      SHITSUJI_API_HOST: 0.0.0.0
      SHITSUJI_WEBHOOK_HOST: 0.0.0.0
      # Telegram reaches out by long polling, so no port is published for it (F06, S32).
      SHITSUJI_TELEGRAM_ENABLED: ${SHITSUJI_TELEGRAM_ENABLED:-false}
      SHITSUJI_TELEGRAM_TOKEN: ${SHITSUJI_TELEGRAM_TOKEN:-}
    ports:
      # The webhook, on this machine only. Remote access comes later (05-open-questions D2).
      - '127.0.0.1:${SHITSUJI_WEBHOOK_PORT:-3000}:3000'
      # The HTTP API for the TUI (and later the web UI).
      - '127.0.0.1:${SHITSUJI_API_PORT:-3001}:3001'
    volumes:
      - coredata:/data
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Self-hosted web search for web.search (decision Q2). Reached only by core; no published port.
  searxng:
    image: searxng/searxng:2026.11.14-a7128d5d1
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-in-env}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [internal, egress]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: shitsuji
      POSTGRES_USER: shitsuji
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shitsuji -d shitsuji']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The sandbox's only way out (F08, S47). Off by default with the sandbox it serves (S48 adds the
  # service on the `sandbox` network and maps sandbox.egress.* to the two lists below). No published
  # port: only containers on the internal network can reach it.
  egress-proxy:
    profiles: ['sandbox']
    image: shitsuji/egress
    build:
      context: .
      dockerfile: docker/egress-proxy/Dockerfile
    environment:
      # Empty is the open default: private addresses are always blocked. Comma- or space-separated.
      SANDBOX_EGRESS_ALLOW: ${SANDBOX_EGRESS_ALLOW:-}
      SANDBOX_EGRESS_DENY: ${SANDBOX_EGRESS_DENY:-}
    networks: [sandbox, egress]
    read_only: true
    tmpfs: [/tmp]
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3128/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # OpenSandbox, used only as a running service from its published images (S43 spike, F08). Off by
  # default: `docker compose --profile opensandbox up -d`. It creates sibling containers for each
  # sandbox, so it needs the Docker socket — that is root on this host; never run it with anything
  # else on the machine that matters.
  opensandbox:
    profiles: ['opensandbox']
    image: opensandbox/server:release-1.1.0@sha256:68ca0212a2749b2c73096ce2ec0264455c64442c45f81007db442f52bf84c9d1
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_API_KEY:-shitsuji-spike-local}
    ports:
      # 8080 often falls in a Windows excluded range (Hyper-V), so the spike uses 18080 by default.
      - '127.0.0.1:${OPENSANDBOX_PORT:-18080}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/opensandbox/sandbox.toml:/etc/opensandbox/config.toml:ro
      - opensandbox-data:/var/lib/opensandbox
    restart: 'no'

networks:
  # No route to the outside world: only services on this network can reach Postgres.
  internal:
    internal: true
  # Outbound internet for core (model APIs, Telegram later). Postgres is not on it.
  egress: {}
  # The sandbox's isolated network (F08, S47): no route out except through egress-proxy, and core is
  # not on it.
  sandbox:
    internal: true

volumes:
  pgdata:
  coredata:
  # OpenSandbox's SQLite store for the spike; separate from the stack's data.
  opensandbox-data:
