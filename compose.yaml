# Shitsuji stack. `docker compose up` for the services; see compose.dev.yaml for local development.
# Must run unchanged on a plain Linux host: no Windows paths, no Docker Desktop-only features.
name: shitsuji

services:
  core:
    image: shitsuji/core
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-secret:
        condition: service_completed_successfully
      sandboxd-gateway:
        condition: service_healthy
    environment:
      # Use a URL-safe POSTGRES_PASSWORD (letters, digits, - and _), since it goes into this URL.
      DATABASE_URL: postgres://shitsuji:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/shitsuji
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHITSUJI_SEARXNG_URL: http://searxng:8080
      # The API and the webhook listen on all interfaces inside the container; the ports below keep
      # them on this machine by default. Set SHITSUJI_API_PUBLISH=0.0.0.0 to publish the API on the
      # LAN (Y2); core reads it back as SHITSUJI_API_PUBLISHED so the warning follows the real
      # exposure. SHITSUJI_PUBLIC_URL supplies the links core sends (Telegram, /desktop).
      SHITSUJI_API_BIND: 0.0.0.0
      SHITSUJI_API_PUBLISHED: ${SHITSUJI_API_PUBLISH:-127.0.0.1}
      SHITSUJI_API_PUBLISHED_PORT: ${SHITSUJI_API_PORT:-3001}
      SHITSUJI_PUBLIC_URL: ${SHITSUJI_PUBLIC_URL:-}
      SHITSUJI_API_TLS_CERT: ${SHITSUJI_API_TLS_CERT:-}
      SHITSUJI_API_TLS_KEY: ${SHITSUJI_API_TLS_KEY:-}
      SHITSUJI_WEBHOOK_HOST: 0.0.0.0
      # Telegram reaches out by long polling, so no port is published for it (F06, S32).
      SHITSUJI_TELEGRAM_ENABLED: ${SHITSUJI_TELEGRAM_ENABLED:-false}
      SHITSUJI_TELEGRAM_TOKEN: ${SHITSUJI_TELEGRAM_TOKEN:-}
      # The Compose stack runs on the sandbox driver (X3); `pnpm dev` from source keeps `host`.
      SHITSUJI_SANDBOX_DRIVER: shitsuji
      # A driver that cannot prove isolation is refused in the deployed stack (W4, S49).
      SHITSUJI_SANDBOX_PROBES_REQUIRE_ISOLATION: 'true'
      # The sandboxd control port (S48). The gateway is the only path from core into the sandbox
      # network: core must not join that network, or the sandbox could dial its API.
      SHITSUJI_SANDBOX_URL: http://sandboxd-gateway:4555
      # The token goes into its own volume, not the shared data one (S48): its directory is
      # root:1002 0770, and core has group 1002 so it can write; commands (uid 1000, gid 1000)
      # cannot traverse it even though they share core's uid number.
      SHITSUJI_SANDBOX_TOKEN_FILE: /run/sandbox-secret/token
    # Lets core (uid 1000) write into the token directory, which is root:1002 0770.
    group_add: ['1002']
    ports:
      # The webhook, on this machine only. Remote access comes later (05-open-questions D2).
      - '127.0.0.1:${SHITSUJI_WEBHOOK_PORT:-3000}:3000'
      # The HTTP API for the TUI and the desktop viewer. Loopback by default; set
      # SHITSUJI_API_PUBLISH=0.0.0.0 (with SHITSUJI_PUBLIC_URL and ideally TLS) for the LAN.
      - '${SHITSUJI_API_PUBLISH:-127.0.0.1}:${SHITSUJI_API_PORT:-3001}:3001'
    volumes:
      - coredata:/data
      - sandbox-secret:/run/sandbox-secret
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Self-hosted web search for web.search (decision Q2). Reached only by core; no published port.
  searxng:
    image: searxng/searxng:2026.11.14-a7128d5d1
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-in-env}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [internal, egress]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: shitsuji
      POSTGRES_USER: shitsuji
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shitsuji -d shitsuji']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Prepares the files the sandbox needs in the shared volume before its containers are created
  # (S48): Compose file mounts resolve when the container is created, so these must exist first.
  # Existing deployments keep their workspace and handoff; only missing files are made.
  sandbox-files:
    image: shitsuji/core
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    entrypoint: ['node', '-e']
    command:
      - |
        const fs = require('node:fs');
        fs.mkdirSync('/data/workspace', { recursive: true });
        fs.mkdirSync('/data/handoff', { recursive: true });
        // The token moved to the sandbox-secret volume (S48); drop the old data-dir copy if present.
        fs.rmSync('/data/sandbox.token', { force: true });
        if (!fs.existsSync('/data/sandbox.egress.json')) {
          fs.writeFileSync('/data/sandbox.egress.json', '{"ready":false}\n');
        }
    user: '1000:1000'
    volumes:
      - coredata:/data
    network_mode: 'none'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: 'no'

  # The token's directory (S48): root owns it, core is in group 1002, and 0770 keeps commands
  # (uid/gid 1000) from even traversing it. Root here has only CHOWN and FOWNER, which is enough
  # because it owns the fresh volume.
  sandbox-secret:
    image: shitsuji/core
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    entrypoint: ['sh', '-c']
    command:
      - |
        chown 0:1002 /run/sandbox-secret
        chmod 0770 /run/sandbox-secret
        # Generate the token once, before core or the sandbox starts: otherwise the sandbox would
        # wait for core while core waits for the gateway, which waits for the sandbox (S49).
        if [ ! -s /run/sandbox-secret/token ]; then
          node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))" \
            > /run/sandbox-secret/token
        fi
        chown 1000:1002 /run/sandbox-secret/token
        chmod 0644 /run/sandbox-secret/token
    user: '0:0'
    volumes:
      - sandbox-secret:/run/sandbox-secret
    network_mode: 'none'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ['no-new-privileges:true']
    restart: 'no'

  # Builds the workspace-only base image the desktop layer starts FROM, and the gateway uses. It
  # exits immediately; `sandbox` waits for it so a fresh `docker compose up --build` builds the base
  # before the desktop image.
  sandbox-base:
    image: shitsuji/sandbox
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    init: false
    entrypoint: ['/bin/true']
    user: '1000:1000'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: 'no'

  # The sandbox itself (F08, S48; F10 in S50). No `user:`: the entrypoint starts as root, takes the
  # token core generated, repairs the workspace and starts the desktop supervisor; sandboxd is uid
  # 1001 and the GUI programs are uid 1000. The only network is `sandbox`, whose only way out is
  # egress-proxy; no desktop port is published.
  sandbox:
    image: shitsuji/sandbox-desktop
    build:
      context: .
      dockerfile: docker/sandbox-desktop/Dockerfile
    init: true
    pids_limit: 2048
    mem_limit: 6g
    cpus: 2
    shm_size: 1g
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, SETPCAP, KILL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/tmp:size=1g', '/run/sandbox:size=1m']
    volumes:
      - type: volume
        source: coredata
        target: /workspace
        volume: { subpath: workspace }
      - type: volume
        source: coredata
        target: /handoff
        volume: { subpath: handoff }
        read_only: true
      - type: volume
        source: sandbox-secret
        target: /run/sandbox-seed
        read_only: true
      - sandbox-home:/home/agent
    networks: [sandbox]
    environment:
      SANDBOX_TOKEN_SEED: /run/sandbox-seed/token
      SANDBOX_TOKEN_FILE: /run/sandbox/token
      SCREEN: 1440x900x24
      # Commands get this as HTTP(S)_PROXY and the lowercase forms (S48).
      SANDBOX_EGRESS_PROXY: http://egress-proxy:3128
    depends_on:
      sandbox-base:
        condition: service_completed_successfully
      sandbox-files:
        condition: service_completed_successfully
      sandbox-secret:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4555/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # The only path from core into the sandbox network (S48): core talks to sandboxd through this
  # relay, so the sandbox cannot dial core's API and the lanBlocked probe holds. It forwards one
  # port and knows no token; sandboxd still authenticates core.
  sandboxd-gateway:
    image: shitsuji/sandbox
    entrypoint: ['node', '/app/dist/gateway-main.js']
    environment:
      SANDBOX_GATEWAY_PORT: 4555
      SANDBOX_GATEWAY_TARGET: sandbox:4555
      # The desktop streams (S51, S55): core reaches websockify's 6081 (watch-only) and 6080
      # (full control) through this relay and never joins the sandbox network. The full stream is
      # only opened after the owner has control, and core closes it on Give back.
      SANDBOX_GATEWAY_VIEWER_PORT: 6081
      SANDBOX_GATEWAY_VIEWER_TARGET: sandbox:6081
      SANDBOX_GATEWAY_FULL_VIEWER_PORT: 6080
      SANDBOX_GATEWAY_FULL_VIEWER_TARGET: sandbox:6080
    networks: [internal, sandbox]
    read_only: true
    tmpfs: [/tmp]
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      sandbox-base:
        condition: service_completed_successfully
      sandbox:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('node:net').connect(4555,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # The sandbox's only way out (F08, S47). On the `sandbox` network only; no published port, so only
  # the sandbox can use it. Core writes `sandbox.egress.allow/deny` to the mounted rules file (S48).
  egress-proxy:
    image: shitsuji/egress
    build:
      context: .
      dockerfile: docker/egress-proxy/Dockerfile
    environment:
      # The env lists still apply, merged with the file; empty is the open default.
      SANDBOX_EGRESS_ALLOW: ${SANDBOX_EGRESS_ALLOW:-}
      SANDBOX_EGRESS_DENY: ${SANDBOX_EGRESS_DENY:-}
      # Until core writes `ready: true`, the proxy denies everything rather than starting open.
      SANDBOX_EGRESS_FILE: /etc/egress/rules.json
    volumes:
      - type: volume
        source: coredata
        target: /etc/egress/rules.json
        volume: { subpath: sandbox.egress.json }
        read_only: true
    depends_on:
      sandbox-files:
        condition: service_completed_successfully
    networks: [sandbox, egress]
    read_only: true
    tmpfs: [/tmp]
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3128/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # OpenSandbox, used only as a running service from its published images (S43 spike, F08). Off by
  # default: `docker compose --profile opensandbox up -d`. It creates sibling containers for each
  # sandbox, so it needs the Docker socket — that is root on this host; never run it with anything
  # else on the machine that matters.
  opensandbox:
    profiles: ['opensandbox']
    image: opensandbox/server:release-1.1.0@sha256:68ca0212a2749b2c73096ce2ec0264455c64442c45f81007db442f52bf84c9d1
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_API_KEY:-shitsuji-spike-local}
    ports:
      # 8080 often falls in a Windows excluded range (Hyper-V), so the spike uses 18080 by default.
      - '127.0.0.1:${OPENSANDBOX_PORT:-18080}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/opensandbox/sandbox.toml:/etc/opensandbox/config.toml:ro
      - opensandbox-data:/var/lib/opensandbox
    restart: 'no'

networks:
  # No route to the outside world: only services on this network can reach Postgres.
  internal:
    internal: true
  # Outbound internet for core (model APIs, Telegram later). Postgres is not on it.
  egress: {}
  # The sandbox's isolated network (F08, S47): no route out except through egress-proxy. The sandbox
  # and the relay are on it; core is not (S48), so the sandbox cannot reach core's API.
  sandbox:
    internal: true

volumes:
  pgdata:
  coredata:
  # The sandbox token: root:1002 0770, out of a command's reach (F08, S48).
  sandbox-secret:
  # pip/npm installs and, later, browser profiles for commands (F08, S48).
  sandbox-home:
  # OpenSandbox's SQLite store for the spike; separate from the stack's data.
  opensandbox-data:
