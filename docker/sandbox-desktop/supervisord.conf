; supervisord runs as root (after the sandbox entrypoint) and starts:
;   - the GUI programs as uid 1000 (agent), after D-Bus and the X display;
;   - sandboxd as uid 1001 through start-sandboxd (it needs the ambient capabilities).
; No supervisor HTTP socket: there is no supervisorctl in the image, and /run is read-only.
[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --address=unix:path=/tmp/dbus-session --nopidfile
user=agent
environment=HOME="/home/agent",USER="agent"
priority=10
startsecs=0
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_SCREEN)s -ac -nolisten tcp
user=agent
environment=HOME="/home/agent",USER="agent"
priority=10
startsecs=1
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:at-spi]
command=/bin/sh -c 'while [ ! -S /tmp/dbus-session ] || [ ! -S /tmp/.X11-unix/X0 ]; do sleep 0.2; done; exec /usr/libexec/at-spi2-registryd'
user=agent
environment=HOME="/home/agent",USER="agent"
priority=20
startsecs=0
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:accessibility-settings]
command=/bin/sh -c 'while [ ! -S /tmp/dbus-session ]; do sleep 0.2; done; exec /usr/bin/gsettings set org.gnome.desktop.interface toolkit-accessibility true'
user=agent
environment=HOME="/home/agent",USER="agent",XDG_CONFIG_HOME="/home/agent/.config",XDG_DATA_HOME="/home/agent/.local/share",XDG_CACHE_HOME="/home/agent/.cache"
priority=25
startsecs=0
autorestart=false
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xfce]
command=/bin/sh -c 'while [ ! -S /tmp/dbus-session ] || [ ! -S /tmp/.X11-unix/X0 ]; do sleep 0.2; done; exec /usr/bin/xfce4-session'
user=agent
environment=HOME="/home/agent",USER="agent",XDG_CONFIG_HOME="/home/agent/.config",XDG_DATA_HOME="/home/agent/.local/share",XDG_CACHE_HOME="/home/agent/.cache"
priority=30
startsecs=1
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The VNC and WebSocket servers are uid 1001, like sandboxd: the password files are 0400 owned by
; 1001, and a command (1000, no capabilities) must not be able to kill the stream and bind its port.
; x11vnc listens on loopback; websockify is the only network-facing part and serves the raw
; WebSocket. core serves the viewer page itself (S51).
[program:vnc-full]
command=/bin/sh -c 'while [ ! -S /tmp/.X11-unix/X0 ]; do sleep 0.2; done; exec /usr/bin/x11vnc -display :0 -auth /dev/null -noshm -noipv6 -forever -shared -rfbport 5900 -rfbauth /run/sandbox/vnc-full -listen 127.0.0.1'
user=sandboxd
environment=HOME="/home/sandboxd",USER="sandboxd"
priority=40
startsecs=1
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vnc-view]
command=/bin/sh -c 'while [ ! -S /tmp/.X11-unix/X0 ]; do sleep 0.2; done; exec /usr/bin/x11vnc -display :0 -auth /dev/null -noshm -noipv6 -forever -shared -viewonly -rfbport 5901 -rfbauth /run/sandbox/vnc-view -listen 127.0.0.1'
user=sandboxd
environment=HOME="/home/sandboxd",USER="sandboxd"
priority=40
startsecs=1
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify-full]
command=/usr/bin/websockify 6080 127.0.0.1:5900
user=sandboxd
environment=HOME="/home/sandboxd",USER="sandboxd"
priority=50
startsecs=1
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify-view]
command=/usr/bin/websockify 6081 127.0.0.1:5901
user=sandboxd
environment=HOME="/home/sandboxd",USER="sandboxd"
priority=50
startsecs=1
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sandboxd]
command=/usr/local/bin/start-sandboxd
user=root
priority=100
startsecs=1
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
